general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
}
shape {
    monitor =
    size = 500, 250
    color = rgba(45, 53, 59, 0.55)    # bg0 at ~55% opacity — semi-transparent
    rounding = 30
    border_size = 5
    border_color = rgba(167, 192, 128, 0.4)   # subtle green outline, Everforest accent
    rotate = 0
    xray = false

    position = 0, 140
    halign = center
    valign = center
}
background {
    monitor =
    path = /home/yousab/Pictures/wallpapers/everforest1-blured.png
    color = rgba(45, 53, 59, 1.0)   # fallback shown briefly while image loads, or if path fails
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.35
    outer_color = rgba(167, 192, 128, 0.4)   # green
    inner_color = rgba(61, 72, 77, 1.0)      # bg2
    font_color = rgba(211, 198, 170, 1.0)    # fg
    fail_color = rgba(230, 126, 128, 1.0)    # red
    check_color = rgba(167, 192, 128, 0.4)   # aqua
    placeholder_text = <span foreground="##9da9a0">Password...</span>
    fade_on_empty = true
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(211, 198, 170, 1.0)   # fg
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(157, 169, 160, 1.0)   # grey2
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = false
    }
}
